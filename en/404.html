  .big { font-family: "JetBrains Mono", ui-monospace, monospace; font-size: clamp(64px, 16vw, 120px); font-weight: 800; line-height: 1; margin-top: 30px;

  h1 { text-wrap: balance; }

<body>

<main>
  <svg id="vio" viewBox="0 0 14 8" shape-rendering="crispEdges" role="img" aria-label="Vio with X eyes"></svg>
  <p class="big">404</p>
  <h1>Oops! This page doesn't exist.</h1>
  <p class="intro" id="say">Vio searched for it with all eight tentacles, but there's nothing here. Maybe the link is wrong or the page has moved.</p>
  <div class="btns"><a class="btn" href="/en/">Back to the site</a><a class="btn ghost" href="/en/#download">Download MyDevAgent</a></div>
</main>
<footer>© 2026 MyDevAgent · Made with 💜 and eight tentacles · <a href="/" hreflang="it" lang="it">Italiano</a></footer>
<script>
// Vio with the "error" face from mydevagent/tui/mascot.py; click it and it cheers you up
const C = { P: "#a855f7", D: "#581c87", L: "#d8b4fe", K: "#1a0b2e", W: "#ffffff", C: "#f472b6", R: "#f43f5e" };
const HEAD = [".....DDDD.....", "...DDPPPPDD...", "..DPLPPPPPPD.."];
const FACES = { error: [".DPRPRPPRPRPD.", ".DPPRPPPPRPPD.", ".DPCPPDDPPCPD."], look: [".DPPPWKPPWKPD.", ".DPPPKKPPKKPD.", ".DPCPPDDPPCPD."], love: [".DPCPCPPCPCPD.", ".DPPCPPPPCPPD.", ".DPCPPKKPPCPD."] };
const LEGS = [["DPDPDPPPPDPDPD", "D.P.P.DD.P.P.D"], ["DPDPDPPPPDPDPD", ".D.P.PDDP.P.D."]];
const svg = document.getElementById("vio");
let face = "error", pose = 0;
function draw() {
  let out = "";
  [...HEAD, ...FACES[face], ...LEGS[pose]].forEach((r, y) => [...r].forEach((c, x) => { if (c !== ".") out += '<rect x="' + x + '" y="' + y + '" width="1.02" height="1.02" fill="' + C[c] + '"/>'; }));
  svg.innerHTML = out;
}
draw();
setInterval(() => { pose ^= 1; draw(); }, 600);
setInterval(() => { if (face === "error") { face = "look"; draw(); setTimeout(() => { if (face === "look") { face = "error"; draw(); } }, 1200); } }, 3500);
svg.addEventListener("click", () => { face = "love"; draw(); document.getElementById("say").textContent = "Thanks! Now I'll take you home 💜"; setTimeout(() => { location.href = "/en/"; }, 1400); });
</script>
</body>
